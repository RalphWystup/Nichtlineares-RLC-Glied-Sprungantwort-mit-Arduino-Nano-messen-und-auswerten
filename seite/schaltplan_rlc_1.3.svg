<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="14">
<!-- schaltplan_rlc_1.3.svg (23.11.2026, 1.3: Beschriftungen frei von Linien; 1.2): Messwiderstand R_s ZWISCHEN Spule und Kondensator, A2 misst das Spulenende (hinter R_Cu), A0 die Kondensatorspannung;
     i = (U_A2 − U_C)/R_s. An dieser Stelle wird kein Pin negativ: negativer Strom fließt erst nach dem Scheitel bei hohem U_C (A2 = U_C + R_s·i >= 2,5 V);
     zwischen D11 und Spule läge der Knoten im Low-Takt bei −R_s·i (negativ) und im High-Takt bei negativem Strom über VCC -- dort nicht.
     1.1: kein Vorwiderstand, R_Cu = 92 Ω Kupferwiderstand der Spule (sein Wort). Nennwerte L = 3,9 H, C = 23 µF; identifiziert R 330–335 Ω, L 10–12 H, C 28 µF.
     Autoren: Prof. Dr.-Ing. Ralph Wystup M.Sc. und Claude (Anthropic, Claude Code) — gemeinsam erstellt. -->
<rect width="940" height="400" fill="#fff"/>
<!-- Nano -->
<rect x="40" y="80" width="170" height="230" rx="6" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="125" y="104" text-anchor="middle" font-weight="600" fill="#1d4f8a">Arduino Nano</text>
<text x="125" y="122" text-anchor="middle" font-size="12" fill="#444">ATmega328P · rlc_sprung_2_7</text>
<text x="125" y="300" text-anchor="middle" font-size="12" fill="#444">USB 5 V (Laptop)</text>
<g stroke="#111" stroke-width="1.5">
  <line x1="210" y1="150" x2="250" y2="150"/>
  <line x1="210" y1="195" x2="250" y2="195"/>
  <line x1="210" y1="235" x2="250" y2="235"/>
  <line x1="210" y1="255" x2="250" y2="255"/>
  <line x1="210" y1="275" x2="250" y2="275"/>
</g>
<text x="204" y="154" text-anchor="end" font-size="12">D11 (PWM, Timer2)</text>
<text x="204" y="199" text-anchor="end" font-size="12">A1 (ADC)</text>
<text x="204" y="239" text-anchor="end" font-size="12">A2 (ADC)</text>
<text x="204" y="259" text-anchor="end" font-size="12">A0 (ADC)</text>
<text x="204" y="279" text-anchor="end" font-size="12">GND</text>
<!-- Hauptmasche -->
<g stroke="#111" stroke-width="1.8" fill="none">
  <line x1="250" y1="150" x2="490" y2="150"/>
  <path d="M490 150 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0"/>
  <line x1="490" y1="132" x2="590" y2="132" stroke-width="2.5"/>
  <line x1="490" y1="128" x2="590" y2="128" stroke-width="1"/>
  <line x1="590" y1="150" x2="605" y2="150"/>
  <rect x="605" y="138" width="50" height="24" fill="#fff"/>
  <line x1="655" y1="150" x2="695" y2="150"/>
  <rect x="695" y="138" width="50" height="24" fill="#fff" stroke-dasharray="4 3"/>
  <line x1="745" y1="150" x2="790" y2="150"/>
  <!-- C -->
  <line x1="790" y1="150" x2="790" y2="200"/>
  <line x1="770" y1="200" x2="810" y2="200" stroke-width="3"/>
  <line x1="770" y1="214" x2="810" y2="214" stroke-width="3"/>
  <line x1="790" y1="214" x2="790" y2="275"/>
  <line x1="790" y1="275" x2="250" y2="275"/>
  <!-- A1: Pinspannung -->
  <line x1="250" y1="195" x2="290" y2="195"/>
  <line x1="290" y1="195" x2="290" y2="150"/>
  <!-- A2: Spulenende vor dem Shunt -->
  <line x1="250" y1="235" x2="675" y2="235"/>
  <line x1="675" y1="235" x2="675" y2="150"/>
  <!-- A0: Kondensator -->
  <line x1="250" y1="255" x2="765" y2="255"/>
  <line x1="765" y1="255" x2="765" y2="150"/>
</g>
<circle cx="290" cy="150" r="3.5" fill="#111"/>
<circle cx="675" cy="150" r="3.5" fill="#111"/>
<circle cx="765" cy="150" r="3.5" fill="#111"/>
<!-- Drossel-Rahmen und Beschriftung -->
<rect x="478" y="112" width="188" height="62" rx="6" fill="none" stroke="#888" stroke-dasharray="5 4"/>
<text x="630" y="124" text-anchor="middle" font-size="12">R<tspan baseline-shift="sub" font-size="9">Cu</tspan> = 92 Ω</text>
<text x="520" y="192" text-anchor="middle" font-size="12" fill="#444">Drossel mit Eisenkern: L(i) nichtlinear,</text>
<text x="520" y="208" text-anchor="middle" font-size="12" fill="#444">Nennwert 3,9 H; R<tspan baseline-shift="sub" font-size="9">Cu</tspan> = Kupferwiderstand</text>
<text x="520" y="224" text-anchor="middle" font-size="12" fill="#444">der Wicklung (kein Vorwiderstand)</text>
<!-- Shunt -->
<text x="720" y="124" text-anchor="middle" font-size="12">R<tspan baseline-shift="sub" font-size="9">s</tspan> = 47 Ω</text>
<text x="720" y="178" text-anchor="middle" font-size="10" fill="#444">Shunt (ab 2.7)</text>
<text x="720" y="190" text-anchor="middle" font-size="10" fill="#444">zw. Spule und C</text>
<text x="806" y="242" font-size="13">C = 23 µF</text>
<!-- Strom -->
<path d="M440 141 l14 0 l-5 -4 m5 4 l-5 4" stroke="#b42318" stroke-width="1.5" fill="none"/>
<text x="447" y="133" text-anchor="middle" font-size="12" fill="#b42318" font-style="italic">i(t)</text>
<!-- Spannungspfeile -->
<g stroke="#2a78d6" stroke-width="1.5" fill="none">
  <path d="M888 158 l0 108 m0 0 l-4 -8 m4 8 l4 -8"/>
  <path d="M290 100 l0 40 m0 0 l-4 -8 m4 8 l4 -8" />
</g>
<text x="895" y="212" font-size="14" fill="#2a78d6" font-style="italic">U<tspan baseline-shift="sub" font-size="10">C</tspan></text>
<text x="895" y="228" font-size="11" fill="#2a78d6">→ A0</text>
<text x="895" y="242" font-size="11" fill="#2a78d6">0 … 5 V</text>
<text x="300" y="98" font-size="13" fill="#2a78d6" font-style="italic">U<tspan baseline-shift="sub" font-size="10">Pin</tspan><tspan font-style="normal" font-size="11" fill="#444"> (PWM 31,4 kHz, 0 / 5 V unter Last) → A1</tspan></text>
<!-- Anregung / Strom -->
<rect x="40" y="330" width="860" height="56" rx="6" fill="#f5f5f4" stroke="#cfcfcf"/>
<text x="52" y="350" font-size="12.5">Eingangssignal = Mittelwert der PWM:  U<tspan baseline-shift="sub" font-size="9">E</tspan> = d · U<tspan baseline-shift="sub" font-size="9">H</tspan> + (1 − d) · U<tspan baseline-shift="sub" font-size="9">L</tspan>,  d = T / 255 (T ≤ 140 → U<tspan baseline-shift="sub" font-size="9">E</tspan> ≤ 2,75 V, Scheitel U<tspan baseline-shift="sub" font-size="9">C</tspan> ≤ 4,5 V).  Sprung bei t = 0, danach Rampe auf 0.</text>
<text x="52" y="372" font-size="12.5">Strom: i = (U<tspan baseline-shift="sub" font-size="9">A2</tspan> − U<tspan baseline-shift="sub" font-size="9">C</tspan>) / R<tspan baseline-shift="sub" font-size="9">s</tspan>; A0 und A2 nebeneinander gewandelt (A0 A2 A1 A1 A2 A0 A1 A1 je 1 ms), 1 ADC-Stufe = 4,89 mV / 47 Ω = 0,10 mA; A2 = U<tspan baseline-shift="sub" font-size="9">C</tspan> + R<tspan baseline-shift="sub" font-size="9">s</tspan>·i bleibt ≥ 0.</text>
</svg>
