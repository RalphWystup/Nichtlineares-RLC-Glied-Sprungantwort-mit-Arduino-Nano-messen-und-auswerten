<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="14">
<!-- schaltplan_rlc_1.1.svg (23.11.2026, sein Wort: „Rext gibt es nicht, das ist der kupferwiderstand der Spule“ -- 1.0 hatte einen Vorwiderstand R_ext = 92 Ω nach dem Manuskript): Arduino Nano mit rlc_sprung_2_6 an der nichtlinearen RLC-Strecke. Werte: Nennwerte R_Cu = 92 Ω (Kupferwiderstand der Spule), L = 3,9 H, C = 23 µF;
     identifiziert (Manuskript Abschnitt 3.1/3.2): R gesamt 335 bzw. 330 Ω, L 10,1 bzw. 11,95 H, C 28,2 µF.
     Autoren: Prof. Dr.-Ing. Ralph Wystup M.Sc. und Claude (Anthropic, Claude Code) — gemeinsam erstellt. -->
<rect width="940" height="400" fill="#fff"/>
<!-- Nano -->
<rect x="40" y="80" width="170" height="230" rx="6" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="125" y="104" text-anchor="middle" font-weight="600" fill="#1d4f8a">Arduino Nano</text>
<text x="125" y="122" text-anchor="middle" font-size="12" fill="#444">ATmega328P · rlc_sprung_2_6</text>
<text x="125" y="300" text-anchor="middle" font-size="12" fill="#444">USB 5 V (Laptop)</text>
<!-- Pins -->
<g stroke="#111" stroke-width="1.5">
  <line x1="210" y1="150" x2="250" y2="150"/>
  <line x1="210" y1="195" x2="250" y2="195"/>
  <line x1="210" y1="235" x2="250" y2="235"/>
  <line x1="210" y1="275" x2="250" y2="275"/>
</g>
<text x="204" y="154" text-anchor="end" font-size="12">D11 (PWM, Timer2)</text>
<text x="204" y="199" text-anchor="end" font-size="12">A1 (ADC)</text>
<text x="204" y="239" text-anchor="end" font-size="12">A0 (ADC)</text>
<text x="204" y="279" text-anchor="end" font-size="12">GND</text>
<!-- Hauptmasche -->
<g stroke="#111" stroke-width="1.8" fill="none">
  <line x1="250" y1="150" x2="490" y2="150"/>
  <!-- Drossel: Spule + R_Cu -->
  <path d="M490 150 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0"/>
  <line x1="490" y1="132" x2="590" y2="132" stroke-width="2.5"/>
  <line x1="490" y1="128" x2="590" y2="128" stroke-width="1"/>
  <line x1="590" y1="150" x2="620" y2="150"/>
  <rect x="620" y="138" width="60" height="24" fill="#fff"/>
  <line x1="680" y1="150" x2="780" y2="150"/>
  <!-- C -->
  <line x1="780" y1="150" x2="780" y2="200"/>
  <line x1="760" y1="200" x2="800" y2="200" stroke-width="3"/>
  <line x1="760" y1="214" x2="800" y2="214" stroke-width="3"/>
  <line x1="780" y1="214" x2="780" y2="275"/>
  <line x1="780" y1="275" x2="250" y2="275"/>
  <!-- A1 -->
  <line x1="250" y1="195" x2="290" y2="195"/>
  <line x1="290" y1="195" x2="290" y2="150"/>
  <!-- A0 -->
  <line x1="250" y1="235" x2="730" y2="235"/>
  <line x1="730" y1="235" x2="730" y2="150"/>
</g>
<circle cx="290" cy="150" r="3.5" fill="#111"/>
<circle cx="730" cy="150" r="3.5" fill="#111"/>
<!-- Drossel-Rahmen -->
<rect x="478" y="112" width="214" height="62" rx="6" fill="none" stroke="#888" stroke-dasharray="5 4"/>
<text x="585" y="192" text-anchor="middle" font-size="12" fill="#444">Drossel mit Eisenkern: L(i) nichtlinear, Nennwert 3,9 H,</text>
<text x="585" y="208" text-anchor="middle" font-size="12" fill="#444">R<tspan baseline-shift="sub" font-size="9">Cu</tspan> = Kupferwiderstand der Wicklung (kein Vorwiderstand)</text>
<!-- Beschriftungen Bauteile -->
<text x="650" y="131" text-anchor="middle" font-size="12">R<tspan baseline-shift="sub" font-size="9">Cu</tspan> = 92 Ω</text>
<text x="812" y="193" font-size="13">C = 23 µF</text>
<!-- Strom -->
<path d="M440 141 l14 0 l-5 -4 m5 4 l-5 4" stroke="#b42318" stroke-width="1.5" fill="none"/>
<text x="447" y="133" text-anchor="middle" font-size="12" fill="#b42318" font-style="italic">i(t)</text>
<!-- Spannungspfeile -->
<g stroke="#2a78d6" stroke-width="1.5" fill="none">
  <path d="M870 158 l0 108 m0 0 l-4 -8 m4 8 l4 -8"/>
  <path d="M290 100 l0 40 m0 0 l-4 -8 m4 8 l4 -8" />
</g>
<text x="878" y="212" font-size="14" fill="#2a78d6" font-style="italic">U<tspan baseline-shift="sub" font-size="10">C</tspan></text>
<text x="878" y="230" font-size="11" fill="#2a78d6">→ A0, 0 … 5 V</text>
<text x="300" y="98" font-size="13" fill="#2a78d6" font-style="italic">U<tspan baseline-shift="sub" font-size="10">Pin</tspan><tspan font-style="normal" font-size="11" fill="#444"> (PWM 31,4 kHz, 0 / 5 V unter Last) → A1</tspan></text>
<!-- Anregung -->
<rect x="40" y="330" width="860" height="56" rx="6" fill="#f5f5f4" stroke="#cfcfcf"/>
<text x="52" y="350" font-size="12.5">Eingangssignal der Strecke = Mittelwert der PWM:  U<tspan baseline-shift="sub" font-size="9">E</tspan> = d · U<tspan baseline-shift="sub" font-size="9">H</tspan> + (1 − d) · U<tspan baseline-shift="sub" font-size="9">L</tspan>,   d = T / 255 (Tastgrad, T ≤ 140 → U<tspan baseline-shift="sub" font-size="9">E</tspan> ≤ 2,75 V, Scheitel U<tspan baseline-shift="sub" font-size="9">C</tspan> ≤ 4,5 V)</text>
<text x="52" y="372" font-size="12.5">Sprung: U<tspan baseline-shift="sub" font-size="9">E</tspan> von 0 auf d · 5 V bei t = 0;  A0 und A1 abwechselnd alle 125 µs gewandelt (Timer1), je Wert B = 4 Wandlungen = 1 ms;  danach Rampe auf 0 (kein Unterschwingen).</text>
</svg>
